name = "asre-seo-website"
pages_build_output_dir = "dist"
compatibility_date = "2025-12-18"
compatibility_flags = ["nodejs_compat"]

[vars]
# No secrets required: form mail uses the native send_email binding below.
# Dashboard → Compute → Email Service → onboard asreseo.com, then attach
# the EMAIL binding to this Pages project (Settings → Functions → Bindings).

send_email = [
  { name = "EMAIL" }
]