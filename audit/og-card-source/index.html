<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Vazir; src: url('regular.woff2') format('woff2'); font-weight: 400; font-display: block; }
  @font-face { font-family: Vazir; src: url('bold.woff2') format('woff2'); font-weight: 700; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: Vazir, system-ui, sans-serif;
    background: linear-gradient(135deg, #1e40af 0%, #4f46e5 48%, #7c3aed 100%);
    position: relative; color: #fff;
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .45; }
  .b1 { width: 520px; height: 520px; background: #38bdf8; top: -180px; right: -120px; }
  .b2 { width: 460px; height: 460px; background: #f472b6; bottom: -190px; left: -110px; }
  .grain { position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.14), transparent 62%); }
  .wrap { position: relative; width: 100%; height: 100%; padding: 76px 90px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 26px; margin-bottom: 40px; }
  .logo { width: 104px; height: 104px; background: rgba(255,255,255,.16); border-radius: 26px; padding: 12px; backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.25); }
  .logo img { width: 100%; height: 100%; object-fit: contain; }
  h1 { font-size: 92px; font-weight: 700; line-height: 1.05; letter-spacing: -1px; }
  .rule { width: 132px; height: 7px; border-radius: 4px; background: linear-gradient(90deg,#fbbf24,#f472b6); margin: 34px 0 30px; }
  p.sub { font-size: 40px; font-weight: 400; line-height: 1.5; opacity: .95; max-width: 900px; }
  .foot { position: absolute; bottom: 62px; left: 90px; right: 90px; display: flex; align-items: center; justify-content: space-between; font-size: 27px; opacity: .85; direction: ltr; }
  .pill { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.28); padding: 11px 24px; border-radius: 999px; }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="grain"></div>
  <div class="wrap">
    <div class="brand">
      <div class="logo"><img src="Logo-spaced.png" alt=""></div>
      <h1>عصر سئو</h1>
    </div>
    <div class="rule"></div>
    <p class="sub">خدمات سئو، هوش مصنوعی و دیجیتال مارکتینگ</p>
    <div class="foot">
      <span class="pill">asreseo.com</span>
      <span>مشاوره رایگان</span>
    </div>
  </div>
</body>
</html>
