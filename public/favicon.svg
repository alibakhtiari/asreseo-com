<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <style>
    :root {
      color-scheme: light dark;
    }
    .bg { fill: #000000; }
    .fg { fill: #FFFFFF; stroke: #FFFFFF; }
    .accent { fill: #CCFF00; stroke: #CCFF00; }

    @media (prefers-color-scheme: light) {
      .bg { fill: #FFFFFF; }
      .fg { fill: #000000; stroke: #000000; }
      .accent { fill: #84CC16; stroke: #84CC16; }
    }
  </style>

  <rect width="100" height="100" rx="20" class="bg" />

  <!-- Left Brutalist Bracket [ -->
  <path d="M28 20 H18 V80 H28" class="fg" stroke-width="4.5" stroke-linecap="square" fill="none" />

  <!-- Right Brutalist Bracket ] -->
  <path d="M72 20 H82 V80 H72" class="fg" stroke-width="4.5" stroke-linecap="square" fill="none" />

  <!-- Ascending Monolith A -->
  <path d="M50 20 L68 64 H56 L50 48 L44 64 H32 L50 20 Z" class="fg" stroke="none" />

  <!-- Search Aperture Reticle / Diamond in Acid Yellow -->
  <polygon points="50,31 57,42 50,53 43,42" class="accent" stroke="none" />

  <!-- Terminal Prompt Cursor _ -->
  <rect x="36" y="73" width="28" height="5" class="accent" stroke="none" />

  <!-- Live Status Dot -->
  <circle cx="82" cy="20" r="3.5" class="accent" stroke="none" />
</svg>